<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: rgb(0, 0, 0);
        color: green;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <!-- Create a hacking simulator which has green background and it shows these messages with random delay of 1 to 7 seconds
    
    Initializing Hacking...
    Reading your files...
    Passwpord files Detected...
    Sending all files passwords and personal files to server...
    Clining up...

    The theree dots must blink so that it looks like a real terminal.

    -->
    <div>>>> Initializing Hacking...</div>
    <script>
      const addItem = async (item) => {
        await ranDelay();
        div = document.createElement("div");
        div.innerHTML = item;
        document.body.append(div);
      };
      const ranDelay = () => {
        return new Promise((resolve, reject) => {
          timeout = 1 + 6 * Math.random();
          setTimeout(() => {
            resolve();
          }, timeout * 1000);
        });
      };

      async function main() {

        let t = setInterval(() => {
            let last = document.getElementsByTagName("div");
            last = last[last.length-1]
            if (last.innerHTML.endsWith("...")) {
                last.innerHTML = last.innerHTML.slice(0,last.innerHTML.length - 3)
            }
            else {
                last.innerHTML = last.innerHTML + "."
            }
        }, 100);


        let text = [
          ">>> Initialized Hacking now reading your data",
          ">>> Reading your files",
          ">>> Password files Detected",
          ">>> Sending all files passwords and personal",
          ">>> files to server",
          ">>> Clining up",
        ];

        for (const item of text) {
          await addItem(item);
        }

        await ranDelay()
        clearInterval(t)
      }
      main()
    </script>
  </body>
</html>

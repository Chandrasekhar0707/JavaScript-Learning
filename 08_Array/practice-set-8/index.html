<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let numbers = [];
      let n = Number(prompt("How Many Numbers?"));
      for (let i = 0; i < n; i++) {
        let num = Number(prompt(`Enter Number ${i + 1} : `));
        numbers.push(num);
      }
      console.log(numbers);
    </script>
  </body>
</html>

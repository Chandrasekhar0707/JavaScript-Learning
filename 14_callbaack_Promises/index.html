<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>callback and promises</title>
</head>
<body>
    <script>

        // sync and async
        
        console.log("Guddu is Hacker")
        console.log("Rohan is Hecker")

        setTimeout(() => {
            console.log("I am inside SetTimeout1")
        }, 5000)

        setTimeout(() => {
            console.log("I am inside SetTimeout2")
        }, 4000)
        console.log("The End")
    </script>
</body>
</html>

<html lang="en">
<head>

    <style>
        .container {
            height: 50vh;
            width: 50vw;
            border: 2px solid black;

        .box {
            height: 40px;

        }
    </style>
</head>
<body>

    <div class="container red bg-green hello" >

    <script>

        // Insertion Method


        // let div = document.createElement("div");
        // div.innerHTML = "<br> I have been inserted <b> hello doston </b>"
        // div.setAttribute("class", "created");

        // document.querySelector(".container").append(div)  // at the end of the end

        // INSERT ADJACENT METHOD

        let cont = document.querySelector(".container")
        cont.insertAdjacentHTML("afterend", "<h1> Hello i am a inocent Boy </h1>")  // insert HTML at the end of the div
        cont.insertAdjacentHTML("afterbegin", "<h1> Hello i am a inocent Boy </h1>")  // insert HTML in the first line of the div

        cont.insertAdjacentHTML("beforebegin", "<h1> Hello i am a inocent Boy </h1>")  // insert HTML before starting the div
